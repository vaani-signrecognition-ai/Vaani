<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - VAANI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-bg: #0f172a;
            --secondary-bg: #1e293b;
            --accent-color: #64ffda;
            --text-primary: #ccd6f6;
            --text-secondary: #8892b0;
            --card-bg: #112240;
            --success: #2ed573;
            --danger: #ff4757;
            --warning: #ffa502;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            padding-bottom: 50px;
        }

        /* Navbar Styles */
        .admin-navbar {
            background-color: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--accent-color) !important;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        /* Dashboard Header */
        .dashboard-header {
            padding: 3rem 0;
            background: linear-gradient(to bottom, #112240, #0f172a);
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(100, 255, 218, 0.05);
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #64ffda, #667eea);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 3rem;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(100, 255, 218, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .stat-icon {
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Table Styles */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto;
        }

        .table {
            color: var(--text-primary);
            margin-bottom: 0;
        }

        .table thead th {
            border-bottom: 2px solid rgba(100, 255, 218, 0.2);
            color: var(--accent-color);
            font-weight: 600;
            padding: 1.2rem;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .table tbody td {
            padding: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background-color: rgba(100, 255, 218, 0.03);
        }

        /* Badges */
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-pending {
            background-color: rgba(255, 165, 2, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .badge-approved {
            background-color: rgba(46, 213, 115, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge-rejected {
            background-color: rgba(255, 71, 87, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        /* Action Buttons */
        .btn-action {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 5px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-approve {
            background-color: rgba(46, 213, 115, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .btn-approve:hover:not(:disabled) {
            background-color: var(--success);
            color: white;
            transform: scale(1.1);
        }

        .btn-reject {
            background-color: rgba(255, 71, 87, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-reject:hover:not(:disabled) {
            background-color: var(--danger);
            color: white;
            transform: scale(1.1);
        }

        .btn-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.3;
        }

        /* Loading Spinner */
        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid var(--card-bg);
            border-bottom-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Responsive Improvements */
        @media (max-width: 768px) {
            .dashboard-header {
                padding: 2rem 1rem;
            }

            .header-title {
                font-size: 1.8rem;
            }

            .admin-navbar {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg admin-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="frontend/index.html">
                <i class="fas fa-shield-alt me-2"></i>VAANI ADMIN
            </a>
            <div class="ms-auto">
                <a href="frontend/index.html" class="btn btn-outline-info btn-sm rounded-pill">
                    <i class="fas fa-home me-1"></i> Back to Site
                </a>
            </div>
        </div>
    </nav>

    <div class="dashboard-header">
        <div class="container">
            <h1 class="header-title">Admin Dashboard</h1>
            <p class="text-center" style="color: var(--text-secondary);">Manage NGO Partnership Requests and Platform
                Growth</p>
        </div>
    </div>

    <div class="container">
        <!-- Stats Row -->
        <div class="stats-container">
            <div class="stat-card">
                <i class="fas fa-file-alt stat-icon"></i>
                <span class="stat-value" id="totalRequests">0</span>
                <span class="stat-label">Total Requests</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-hourglass-half stat-icon" style="color: var(--warning);"></i>
                <span class="stat-value" id="pendingRequests">0</span>
                <span class="stat-label">Pending</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle stat-icon" style="color: var(--success);"></i>
                <span class="stat-value" id="approvedRequests">0</span>
                <span class="stat-label">Approved</span>
            </div>
        </div>

        <!-- Requests Table Section -->
        <h4 class="mb-4 d-flex align-items-center">
            <i class="fas fa-university me-2 text-info"></i>NGO Partnership Requests
        </h4>

        <div class="table-container">
            <table class="table" id="requestsTable">
                <thead>
                    <tr>
                        <th>Organization</th>
                        <th>Contact Person</th>
                        <th>Location</th>
                        <th>Purpose</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Loading State -->
                    <tr id="loaderRow">
                        <td colspan="6">
                            <div class="loader-container">
                                <span class="loader"></span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: var(--card-bg); border: 1px solid var(--accent-color);">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white">Full Organization Description</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <p id="modalDescription" style="white-space: pre-wrap; color: var(--text-primary);"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const tableBody = document.getElementById('tableBody');
        const totalRequestsEl = document.getElementById('totalRequests');
        const pendingRequestsEl = document.getElementById('pendingRequests');
        const approvedRequestsEl = document.getElementById('approvedRequests');
        let allRequests = [];

        // Fetch Requests
        function fetchRequests() {
            let apiUrl = "/api/admin/ngo-requests";
            if (window.location.protocol === 'file:') {
                apiUrl = "http://127.0.0.1:5000/api/admin/ngo-requests";
            }

            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    allRequests = data;
                    updateDashboard();
                })
                .catch(err => {
                    console.error("Error fetching requests:", err);
                    showErrorState();
                });
        }

        function updateDashboard() {
            // Update Stats
            totalRequestsEl.textContent = allRequests.length;
            pendingRequestsEl.textContent = allRequests.filter(r => r.status === 'PENDING').length;
            approvedRequestsEl.textContent = allRequests.filter(r => r.status === 'APPROVED').length;

            if (allRequests.length === 0) {
                showEmptyState();
                return;
            }

            renderTable();
        }

        function renderTable() {
            tableBody.innerHTML = '';

            allRequests.forEach(req => {
                const tr = document.createElement('tr');

                const statusClass = req.status === 'PENDING' ? 'badge-pending' :
                    req.status === 'APPROVED' ? 'badge-approved' : 'badge-rejected';

                tr.innerHTML = `
                    <td>
                        <div class="fw-bold text-white">${req.org_name}</div>
                        <small class="text-secondary">${req.email}</small>
                    </td>
                    <td>
                        <div>${req.contact_person}</div>
                        <small class="text-secondary">${req.phone}</small>
                    </td>
                    <td>${req.city}</td>
                    <td><span class="text-info">${req.purpose}</span></td>
                    <td><span class="status-badge ${statusClass}">${req.status}</span></td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center">
                            <button class="btn-action btn-approve" onclick="takeAction(${req.request_id}, 'APPROVED')" 
                                    ${req.status !== 'PENDING' ? 'disabled' : ''} title="Approve">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="btn-action btn-reject" onclick="takeAction(${req.request_id}, 'REJECTED')"
                                    ${req.status !== 'PENDING' ? 'disabled' : ''} title="Reject">
                                <i class="fas fa-times"></i>
                            </button>
                            <button class="btn-action" style="background: rgba(100,255,218,0.1); color: var(--accent-color); border: 1px solid var(--accent-color);" 
                                    onclick="showDetails('${encodeURIComponent(req.description)}')" title="View Description">
                                <i class="fas fa-info-circle"></i>
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function takeAction(requestId, action) {
            const confirmMsg = `Are you sure you want to ${action.toLowerCase()} this request?`;
            if (!confirm(confirmMsg)) return;

            // Show loading overlay or button state
            let apiUrl = "/api/admin/ngo-request/action";
            if (window.location.protocol === 'file:') {
                apiUrl = "http://127.0.0.1:5000/api/admin/ngo-request/action";
            }

            fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ request_id: requestId, action: action })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.temp_password) {
                        const emailMsg = data.email_sent
                            ? "An email has been sent to the NGO with these details."
                            : "⚠️ Note: Email could not be sent. Please share details manually.";

                        alert(`NGO Approved Successfully!\n\n` +
                            `Temporary Password: ${data.temp_password}\n\n` +
                            `${emailMsg}`);
                    } else {
                        alert(data.message || 'Action completed');
                    }
                    fetchRequests(); // Refresh table
                })
                .catch(err => {
                    console.error('Error:', err);
                    alert('Action failed. Check console.');
                });
        }

        function showDetails(encodedDesc) {
            const desc = decodeURIComponent(encodedDesc);
            document.getElementById('modalDescription').textContent = desc;
            const modal = new bootstrap.Modal(document.getElementById('detailsModal'));
            modal.show();
        }

        function showEmptyState() {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <p>No partnership requests found.</p>
                        </div>
                    </td>
                </tr>
            `;
        }

        function showErrorState() {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle text-danger"></i>
                            <p>Failed to load requests. Please check your connection.</p>
                        </div>
                    </td>
                </tr>
            `;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchRequests);
    </script>
</body>

</html>
