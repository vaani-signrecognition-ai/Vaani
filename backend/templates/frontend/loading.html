<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAANI - Loading</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Loading/Landing Page -->
    <div class="loader">
        <div class="loader-logo-container">
            <!-- Logo Box with animation -->
            <div class="loader-logo-box">
                <!-- Your existing logo image -->
                <div class="loader-logo-wrapper">
                    <img src="assets/image.jpeg" class="loader-logo-img" alt="VAANI Logo">
                    <!-- Glow effect around logo -->
                    <div class="loader-logo-glow"></div>
                </div>

                <!-- Hands animation (visual representation) -->
                <div class="loader-hands-animation">
                    <div class="loader-hand loader-left-hand">
                        <i class="fas fa-hand-peace"></i>
                    </div>
                    <div class="loader-hand loader-right-hand">
                        <i class="fas fa-hand-peace"></i>
                    </div>
                </div>

                <!-- VAANI Text -->
                <div class="loader-logo-text-wrapper">
                    <h1 class="loader-logo-text">VAANI</h1>
                    <p class="loader-tagline">Voice for Voiceless</p>
                </div>

                <!-- Progress Bar -->
                <div class="loader-progress-container">
                    <div class="loader-progress-bar"></div>
                </div>
            </div>

            <!-- Loading Message -->
            <div class="loader-message">
                <p>Loading interactive sign language experience...</p>
                <div class="loader-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for redirect -->
    <script>
        // Check if loading page has been shown in this session
        if (sessionStorage.getItem('vaaniHasLoaded') !== 'true') {
            // First visit this session, show loading and then allow redirect

            // Auto redirect to main page after animation
            setTimeout(() => {
                // Add fade out effect
                document.querySelector('.loader').classList.add('fade-out');

                // Set session flag BEFORE redirect
                sessionStorage.setItem('vaaniHasLoaded', 'true');

                // Redirect after fade out completes
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);
            }, 2800);

            // Allow user to skip loading by clicking
            document.querySelector('.loader').addEventListener('click', function () {
                sessionStorage.setItem('vaaniHasLoaded', 'true');
                window.location.href = "index.html";
            });

            // Allow user to skip loading with Enter key
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    sessionStorage.setItem('vaaniHasLoaded', 'true');
                    window.location.href = "index.html";
                }
            });
        } else {
            // Already visited this session, go directly to main page
            window.location.href = "index.html";
        }
    </script>
</body>

</html>
